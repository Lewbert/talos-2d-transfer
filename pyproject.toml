[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talos"
description = "Transfer and Alignment Laboratory Operating System: microscope hardware control and computer vision for 2D-material transfer and stacking"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dynamic = ["version"]
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pyserial>=3.5",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",

    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
# Alternative camera backends. They are UNWIRED from the application (see
# talos/hal/devices/camera/__init__.py): the Axiocam 208 needs SmartCamApi
# over libusb0, and the GenTL / Micro-Manager / MCam paths either need a
# USB3-Vision driver this machine does not have or run far too slowly to
# use. The code stays as stored knowledge — install these extras only for
# development tooling against those backends.
gentl = ["harvesters>=1.4"]
micro-manager = ["pymmcore-plus>=0.9"]
dev = ["pytest>=7.0", "pyinstaller>=6.3"]

[tool.setuptools.packages.find]
include = ["talos*"]

[tool.setuptools.dynamic]
version = {attr = "talos.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: real-time closed-loop simulation suites (autofocus / scan)",
]
