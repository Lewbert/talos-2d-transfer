# TALOS conda environment (see pyproject.toml for the source of truth).
#   conda env create -f environment.yml
#   conda activate talos
name: talos
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - PySide6>=6.6
      - numpy>=1.26
      - opencv-python>=4.8
      - pyserial>=3.5
      - inputs>=0.5
      - scipy>=1.11
      - pytest>=7.0
      - pyinstaller>=6.3
      # the alternative camera backends (harvesters / pymmcore-plus) are
      # optional extras — see pyproject.toml
